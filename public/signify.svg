      <circle cx="155" cy="180" r="5.5" fill="#8B72E8" stroke="#1B1B3A" stroke-width="3" />
      <circle cx="125" cy="198" r="5.5" fill="#8B72E8" stroke="#1B1B3A" stroke-width="3" />
      <circle cx="155" cy="198" r="5.5" fill="#8B72E8" stroke="#1B1B3A" stroke-width="3" />
      <circle cx="125" cy="216" r="5.5" fill="#8B72E8" stroke="#1B1B3A" stroke-width="3" />
