    <path d="M157 246 Q145 243 144 251 Q142 259 155 260 L181 261 Q198 261 196 251 Q194 241 177 245Z" fill="#FFC93C" stroke="#1B1B3A" stroke-width="5" stroke-linejoin="round" />

